name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: vp pack
      - run: vp check
        if: runner.os != 'Windows'
      - run: vp exec playwright-core install --only-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: vp test
