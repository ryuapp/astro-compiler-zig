name: Setup
description: Set up Vite+ and Zig.

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.21.2
      with:
        node-version-file: .node-version
        run-install: true
        cache: true
    - uses: jdx/mise-action@v5.2.1
    - name: Configure Zig global cache
      shell: pwsh
      run: |
        $cachePath = Join-Path $env:GITHUB_WORKSPACE '.zig-cache/global'
        "ZIG_GLOBAL_CACHE_DIR=$cachePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Cache Zig build and packages
      uses: actions/cache@v6.1.0
      with:
        path: |
          .zig-cache
          zig-pkg
        key: zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'build.zig.zon') }}-${{ hashFiles('build.zig', 'src/**') }}
        restore-keys: |
          zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'build.zig.zon') }}-
